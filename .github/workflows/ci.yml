name: Validate and deploy desktop guide

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install documentation dependencies
        run: python -m pip install -r requirements.txt
      - name: Check translation URLs
        run: node --test tests/translate.test.cjs
      - name: Build with strict link and anchor validation
        run: python -m mkdocs build --strict
      - name: Check generated pages, links and assets
        run: python scripts/check_site.py site
      - name: Save reviewable HTML for every build
        uses: actions/upload-artifact@v4
        with:
          name: desktop-wiki-review
          path: site/
      - name: Upload production Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site/

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        uses: actions/configure-pages@v5
      - name: Publish validated guide
        id: deployment
        uses: actions/deploy-pages@v4
